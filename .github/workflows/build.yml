# Minden feltöltés után a GitHub saját Windows-gépén lefordítja és teszteli a programot,
# majd a kész csomagot (als_cli.exe + indító) közzéteszi a Releases oldalon "latest" néven.
name: SoundNexus Pro build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # 1) CMake + Visual Studio fordítás (a fejlesztői út ellenőrzése)
  msvc:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Konfigurálás (CMake, RtMidi letöltéssel)
        run: cmake -S . -B build -A x64

      - name: Fordítás
        run: cmake --build build --config Release

      - name: Demó futtatása
        run: build\Release\als_cli.exe demo

      - name: Sample-vágó teszt
        shell: pwsh
        run: |
          python -c "import wave,math,struct; sr=44100; s=[0]*2205+[int(26000*math.sin(2*math.pi*220*i/sr)*math.exp(-6*i/sr)) for i in range(int(0.8*sr))]+[0]*13230; w=wave.open('test.wav','wb'); w.setnchannels(1); w.setsampwidth(2); w.setframerate(sr); w.writeframes(struct.pack('<%dh'%len(s),*s)); w.close()"
          build\Release\als_cli.exe trim test.wav test_vagott.wav
          if (-not (Test-Path test_vagott.wav)) { throw "A vágott fájl nem jött létre" }

  # 2) Az egykattintásos indító (ALS_Inditas.bat) valódi tesztje: letölti a w64devkit
  #    fordítót és az RtMidi-t, lefordítja a programot, majd a menüből kilép.
  launcher:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: ALS_Inditas.bat futtatása (menü → 0 = kilépés)
        shell: cmd
        run: echo 0| ALS_Inditas.bat

      - name: Ellenőrzés és demó
        shell: cmd
        run: |
          if not exist bin\als_cli.exe exit /b 1
          bin\als_cli.exe demo

      - name: WAV ráhúzás teszt (a .bat paramétereként)
        shell: pwsh
        run: |
          python -c "import wave,math,struct; sr=44100; s=[0]*2205+[int(26000*math.sin(2*math.pi*220*i/sr)*math.exp(-6*i/sr)) for i in range(int(0.8*sr))]+[0]*13230; w=wave.open('minta.wav','wb'); w.setnchannels(1); w.setsampwidth(2); w.setframerate(sr); w.writeframes(struct.pack('<%dh'%len(s),*s)); w.close()"
          cmd /c "echo.| ALS_Inditas.bat minta.wav"
          if (-not (Test-Path minta_vagott.wav)) { throw "A ráhúzott WAV nem lett levágva" }

      - name: Csomag összeállítása
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path package\bin | Out-Null
          Copy-Item bin\als_cli.exe package\bin\
          Copy-Item ALS_Inditas.bat, README.md package\
          Compress-Archive -Path package\* -DestinationPath ALS-Windows.zip -Force

      - uses: actions/upload-artifact@v4
        with:
          name: ALS-Windows
          path: ALS-Windows.zip

  # 3) A grafikus program (Flutter) + a zenei mag DLL-je
  gui:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Zenei mag (als_core_ffi.dll)
        run: |
          cmake -S . -B build -A x64
          cmake --build build --config Release --target als_core_ffi

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter projekt előkészítése
        working-directory: flutter_app
        shell: pwsh
        run: |
          flutter config --enable-windows-desktop
          flutter create --platforms=windows --project-name als_stage --org hu.bpmusic .
          if (Test-Path test) { Remove-Item -Recurse -Force test }
          # Ablak címe és mérete
          $f = 'windows\runner\main.cpp'
          $c = Get-Content $f -Raw
          $c = $c -replace 'L"als_stage"', 'L"SoundNexus Pro"'
          $c = $c -replace 'Win32Window::Size size\(\d+, \d+\)', 'Win32Window::Size size(1280, 780)'
          Set-Content $f $c -NoNewline
          # Teljes képernyős (maximalizált) indulás, hogy kis kijelzőn se lógjon ki semmi
          $w = 'windows\runner\win32_window.cpp'
          (Get-Content $w -Raw) -replace 'SW_SHOWNORMAL', 'SW_SHOWMAXIMIZED' | Set-Content $w -NoNewline
          flutter pub get

      - name: Kódellenőrzés (flutter analyze)
        working-directory: flutter_app
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Fordítás (flutter build windows)
        working-directory: flutter_app
        run: flutter build windows --release

      - name: Csomag összeállítása
        shell: pwsh
        run: |
          $out = 'flutter_app\build\windows\x64\runner\Release'
          Copy-Item build\Release\als_core_ffi.dll $out\
          foreach ($d in 'msvcp140.dll','vcruntime140.dll','vcruntime140_1.dll') {
            Copy-Item "$env:WINDIR\System32\$d" $out\ -ErrorAction SilentlyContinue
          }
          Rename-Item "$out\als_stage.exe" 'SoundNexus Pro.exe'
          New-Item -ItemType Directory -Force -Path "gui_pkg\SoundNexus Pro" | Out-Null
          Copy-Item "$out\*" "gui_pkg\SoundNexus Pro\" -Recurse
          Compress-Archive -Path "gui_pkg\SoundNexus Pro" -DestinationPath SoundNexusPro-Windows.zip -Force

      - name: Indítási teszt és képernyőképek (PC, szerkesztő mód, tablet mód)
        shell: pwsh
        run: |
          .github\scripts\screenshot.ps1 -Exe "$PWD\gui_pkg\SoundNexus Pro\SoundNexus Pro.exe" -Out "$PWD\screenshot.png" -Tag pc
          $env:SNX_EDIT_MODE = '1'
          .github\scripts\screenshot.ps1 -Exe "$PWD\gui_pkg\SoundNexus Pro\SoundNexus Pro.exe" -Out "$PWD\screenshot_edit.png" -Tag edit
          $env:SNX_EDIT_MODE = ''
          $env:SNX_OPEN = 'sample'
          .github\scripts\screenshot.ps1 -Exe "$PWD\gui_pkg\SoundNexus Pro\SoundNexus Pro.exe" -Out "$PWD\screenshot_sample.png" -Tag sample
          $env:SNX_OPEN = 'voices'
          .github\scripts\screenshot.ps1 -Exe "$PWD\gui_pkg\SoundNexus Pro\SoundNexus Pro.exe" -Out "$PWD\screenshot_voices.png" -Tag voices
          $env:SNX_OPEN = ''
          $env:SNX_FORCE_MOBILE = '1'
          .github\scripts\screenshot.ps1 -Exe "$PWD\gui_pkg\SoundNexus Pro\SoundNexus Pro.exe" -Out "$PWD\screenshot_tablet.png" -Tag tablet

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshot
          path: screenshot.png
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        with:
          name: SoundNexusPro-Windows
          path: SoundNexusPro-Windows.zip

  # 4) macOS program (univerzális: Intel + Apple Silicon, macOS 10.15+ — a 2015-ös MacBookokon is fut)
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Zenei mag (libals_core_ffi.dylib, univerzális)
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="x86_64;arm64" -DCMAKE_OSX_DEPLOYMENT_TARGET=10.15
          cmake --build build --target als_core_ffi -j 4
          lipo -info build/libals_core_ffi.dylib

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter projekt előkészítése
        working-directory: flutter_app
        run: |
          flutter create --platforms=macos --project-name als_stage --org hu.bpmusic .
          rm -rf test
          # Alkalmazás neve: ALS; sandbox kikapcsolva (USB-MIDI és fájlok eléréséhez)
          sed -i '' 's/^PRODUCT_NAME = .*/PRODUCT_NAME = SoundNexus Pro/' macos/Runner/Configs/AppInfo.xcconfig
          plutil -insert NSBluetoothAlwaysUsageDescription -string "Bluetooth MIDI kapcsolat a hangszerrel" macos/Runner/Info.plist || true
          for f in macos/Runner/DebugProfile.entitlements macos/Runner/Release.entitlements; do
            perl -0pi -e 's|(com.apple.security.app-sandbox</key>\s*)<true/>|${1}<false/>|' "$f"
          done
          flutter pub get

      - name: Kódellenőrzés
        working-directory: flutter_app
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Fordítás (flutter build macos)
        working-directory: flutter_app
        run: flutter build macos --release

      - name: Csomag összeállítása
        run: |
          APP="flutter_app/build/macos/Build/Products/Release/SoundNexus Pro.app"
          cp build/libals_core_ffi.dylib "$APP/Contents/MacOS/"
          codesign --force --deep --sign - "$APP"
          lipo -info "$APP/Contents/MacOS/SoundNexus Pro"
          plutil -p "$APP/Contents/Info.plist" | grep -i LSMinimumSystemVersion || true
          ditto -c -k --keepParent "$APP" SoundNexusPro-macOS.zip

      - name: Indítási teszt
        run: |
          APP="flutter_app/build/macos/Build/Products/Release/SoundNexus Pro.app"
          "$APP/Contents/MacOS/SoundNexus Pro" > app.log 2>&1 &
          PID=$!
          sleep 20
          if ! kill -0 $PID 2>/dev/null; then echo "A program kilépett:"; cat app.log; exit 1; fi
          screencapture -x shot.png || true
          if [ -f shot.png ]; then
            sips -s format jpeg -s formatOptions 70 -Z 1400 shot.png --out shot.jpg >/dev/null
            echo SCREENSHOT-BEGIN; base64 -i shot.jpg | fold -w 3000 | sed 's/^/B64:/'; echo SCREENSHOT-END
          fi
          kill $PID

      - uses: actions/upload-artifact@v4
        with:
          name: SoundNexusPro-macOS
          path: SoundNexusPro-macOS.zip

  # 5) Android (tablet, telefon): APK
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter projekt előkészítése (Android)
        working-directory: flutter_app
        run: |
          flutter create --platforms=android --project-name als_stage --org hu.bpmusic .
          rm -rf test
          M=android/app/src/main/AndroidManifest.xml
          # Név, internet (Wi-Fi átvitel), helyi HTTP, USB MIDI
          sed -i 's/android:label="als_stage"/android:label="SoundNexus Pro"/' $M
          sed -i 's|<application|<uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.CHANGE_WIFI_MULTICAST_STATE"/>\n    <uses-feature android:name="android.software.midi" android:required="false"/>\n    <uses-feature android:name="android.hardware.usb.host" android:required="false"/>\n    <application android:usesCleartextTraffic="true"|' $M
          G=$(ls android/app/build.gradle* | head -1)
          sed -i -E 's/minSdk(Version)? *=? *flutter\.minSdkVersion/minSdk = 24/' $G
          grep -n "minSdk" $G || true
          flutter pub get

      - name: Kódellenőrzés
        working-directory: flutter_app
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Fordítás (APK)
        working-directory: flutter_app
        run: flutter build apk --release

      - name: Csomag
        run: cp flutter_app/build/app/outputs/flutter-apk/app-release.apk SoundNexusPro-Android.apk

      - uses: actions/upload-artifact@v4
        with:
          name: SoundNexusPro-Android
          path: SoundNexusPro-Android.apk

  # 6) iOS (iPad, iPhone): fordítási ellenőrzés aláírás nélkül
  #    Telepítéshez Apple fejlesztői fiók kell (évi 99 USD) — lásd README.
  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter projekt előkészítése (iOS)
        working-directory: flutter_app
        run: |
          flutter create --platforms=ios --project-name als_stage --org hu.bpmusic .
          rm -rf test
          P=ios/Runner/Info.plist
          plutil -replace CFBundleDisplayName -string "SoundNexus Pro" $P
          plutil -insert NSBluetoothAlwaysUsageDescription -string "Bluetooth MIDI kapcsolat a hangszerrel" $P
          plutil -insert NSLocalNetworkUsageDescription -string "A fellépő csomag fogadása a számítógépről Wi-Fi-n" $P
          plutil -insert NSAppTransportSecurity -json '{"NSAllowsLocalNetworking":true}' $P
          plutil -insert UIFileSharingEnabled -bool YES $P
          plutil -insert LSSupportsOpeningDocumentsInPlace -bool YES $P
          flutter pub get

      - name: Fordítás (iOS, aláírás nélkül)
        working-directory: flutter_app
        run: flutter build ios --release --no-codesign

  # 7) Közzététel a Releases oldalon (csak a main ágon)
  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [msvc, launcher, gui, macos, android, ios]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ALS-Windows

      - uses: actions/download-artifact@v4
        with:
          name: SoundNexusPro-Windows

      - uses: actions/download-artifact@v4
        with:
          name: SoundNexusPro-macOS

      - uses: actions/download-artifact@v4
        with:
          name: SoundNexusPro-Android

      - name: "Release frissítése: latest"
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest SoundNexusPro-Windows.zip SoundNexusPro-macOS.zip SoundNexusPro-Android.apk ALS-Windows.zip \
            --target "${{ github.sha }}" \
            --title "SoundNexus Pro – legfrissebb program (Windows, macOS, Android)" \
            --notes "**SoundNexusPro-Windows.zip** – Windows 10/11 szerkesztő: kicsomagolás után a **SoundNexus Pro.exe**.

          **SoundNexusPro-macOS.zip** – Mac szerkesztő (Intel és Apple Silicon, macOS 12+). Első indításkor: jobb klikk → Megnyitás → Megnyitás.

          **SoundNexusPro-Android.apk** – tablet és telefon (Android 7.0+), fellépő mód.

          ALS-Windows.zip – parancssori segédeszköz (fejlesztőknek).

          Commit: ${{ github.sha }}"
