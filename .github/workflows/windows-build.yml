# Minden feltöltés után a GitHub saját Windows-gépén lefordítja és teszteli a programot,
# majd a kész csomagot (als_cli.exe + indító) közzéteszi a Releases oldalon "latest" néven.
name: Windows build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # 1) CMake + Visual Studio fordítás (a fejlesztői út ellenőrzése)
  msvc:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Konfigurálás (CMake, RtMidi letöltéssel)
        run: cmake -S . -B build -A x64

      - name: Fordítás
        run: cmake --build build --config Release

      - name: Demó futtatása
        run: build\Release\als_cli.exe demo

      - name: Sample-vágó teszt
        shell: pwsh
        run: |
          python -c "import wave,math,struct; sr=44100; s=[0]*2205+[int(26000*math.sin(2*math.pi*220*i/sr)*math.exp(-6*i/sr)) for i in range(int(0.8*sr))]+[0]*13230; w=wave.open('test.wav','wb'); w.setnchannels(1); w.setsampwidth(2); w.setframerate(sr); w.writeframes(struct.pack('<%dh'%len(s),*s)); w.close()"
          build\Release\als_cli.exe trim test.wav test_vagott.wav
          if (-not (Test-Path test_vagott.wav)) { throw "A vágott fájl nem jött létre" }

  # 2) Az egykattintásos indító (ALS_Inditas.bat) valódi tesztje: letölti a w64devkit
  #    fordítót és az RtMidi-t, lefordítja a programot, majd a menüből kilép.
  launcher:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: ALS_Inditas.bat futtatása (menü → 0 = kilépés)
        shell: cmd
        run: echo 0| ALS_Inditas.bat

      - name: Ellenőrzés és demó
        shell: cmd
        run: |
          if not exist bin\als_cli.exe exit /b 1
          bin\als_cli.exe demo

      - name: WAV ráhúzás teszt (a .bat paramétereként)
        shell: pwsh
        run: |
          python -c "import wave,math,struct; sr=44100; s=[0]*2205+[int(26000*math.sin(2*math.pi*220*i/sr)*math.exp(-6*i/sr)) for i in range(int(0.8*sr))]+[0]*13230; w=wave.open('minta.wav','wb'); w.setnchannels(1); w.setsampwidth(2); w.setframerate(sr); w.writeframes(struct.pack('<%dh'%len(s),*s)); w.close()"
          cmd /c "echo.| ALS_Inditas.bat minta.wav"
          if (-not (Test-Path minta_vagott.wav)) { throw "A ráhúzott WAV nem lett levágva" }

      - name: Csomag összeállítása
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path package\bin | Out-Null
          Copy-Item bin\als_cli.exe package\bin\
          Copy-Item ALS_Inditas.bat, README.md package\
          Compress-Archive -Path package\* -DestinationPath ALS-Windows.zip -Force

      - uses: actions/upload-artifact@v4
        with:
          name: ALS-Windows
          path: ALS-Windows.zip

  # 3) A grafikus program (Flutter) + a zenei mag DLL-je
  gui:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Zenei mag (als_core_ffi.dll)
        run: |
          cmake -S . -B build -A x64
          cmake --build build --config Release --target als_core_ffi

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter projekt előkészítése
        working-directory: flutter_app
        shell: pwsh
        run: |
          flutter config --enable-windows-desktop
          flutter create --platforms=windows --project-name als_stage --org hu.bpmusic .
          if (Test-Path test) { Remove-Item -Recurse -Force test }
          # Ablak címe és mérete
          $f = 'windows\runner\main.cpp'
          $c = Get-Content $f -Raw
          $c = $c -replace 'L"als_stage"', 'L"ALS - Yamaha Arranger Live Suite"'
          $c = $c -replace 'Win32Window::Size size\(\d+, \d+\)', 'Win32Window::Size size(1280, 780)'
          Set-Content $f $c -NoNewline
          # Teljes képernyős (maximalizált) indulás, hogy kis kijelzőn se lógjon ki semmi
          $w = 'windows\runner\win32_window.cpp'
          (Get-Content $w -Raw) -replace 'SW_SHOWNORMAL', 'SW_SHOWMAXIMIZED' | Set-Content $w -NoNewline
          flutter pub get

      - name: Kódellenőrzés (flutter analyze)
        working-directory: flutter_app
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Fordítás (flutter build windows)
        working-directory: flutter_app
        run: flutter build windows --release

      - name: Csomag összeállítása
        shell: pwsh
        run: |
          $out = 'flutter_app\build\windows\x64\runner\Release'
          Copy-Item build\Release\als_core_ffi.dll $out\
          foreach ($d in 'msvcp140.dll','vcruntime140.dll','vcruntime140_1.dll') {
            Copy-Item "$env:WINDIR\System32\$d" $out\ -ErrorAction SilentlyContinue
          }
          Rename-Item "$out\als_stage.exe" 'ALS.exe'
          New-Item -ItemType Directory -Force -Path gui_pkg\ALS | Out-Null
          Copy-Item "$out\*" gui_pkg\ALS\ -Recurse
          Compress-Archive -Path gui_pkg\ALS -DestinationPath ALS-Program-Windows.zip -Force

      - name: Indítási teszt és képernyőkép
        shell: pwsh
        run: .github\scripts\screenshot.ps1 -Exe "$PWD\gui_pkg\ALS\ALS.exe" -Out "$PWD\screenshot.png"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshot
          path: screenshot.png
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        with:
          name: ALS-Program-Windows
          path: ALS-Program-Windows.zip

  # 4) Közzététel a Releases oldalon (csak a main ágon)
  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [msvc, launcher, gui]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ALS-Windows

      - uses: actions/download-artifact@v4
        with:
          name: ALS-Program-Windows

      - name: "Release frissítése: latest"
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest ALS-Program-Windows.zip ALS-Windows.zip \
            --target "${{ github.sha }}" \
            --title "ALS – legfrissebb Windows program" \
            --notes "**ALS-Program-Windows.zip** – a grafikus program: csomagold ki, és indítsd az ALS mappában lévő **ALS.exe** fájlt. Telepíteni nem kell.

          ALS-Windows.zip – parancssori segédeszköz (fejlesztőknek, teszteléshez).

          Commit: ${{ github.sha }}"
